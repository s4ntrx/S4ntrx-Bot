{% extends "base.html" %}
{% block title %}S4ntrx Bot — Cybersecurity Education Assistant{% endblock %}
{% block content %}
<div class="cg-hero text-center py-5">
  <h1 class="fw-bold">S4ntrx Bot</h1>
  <p class="lead text-muted">A cybersecurity education assistant for students.</p>
  {% if current_user.is_authenticated %}
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-cg-accent btn-lg mt-3">Go to Dashboard</a>
  {% else %}
    <div class="d-flex justify-content-center gap-3 mt-3">
      <a href="{{ url_for('auth.register') }}" class="btn btn-cg-accent btn-lg">Get Started</a>
      <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-lg">Log In</a>
    </div>
  {% endif %}
</div>
{% endblock %}
