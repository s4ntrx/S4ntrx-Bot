{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flashes" role="status">
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}"><span>{{ message }}</span><button type="button" aria-label="Dismiss"><svg class="i"><use href="#i-x"/></svg></button></div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
